<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Nexus ERP</title>
  <!-- AdminLTE 4 (terbaru) + Bootstrap 5.3 + Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); min-height:  `100vh`; }
  </style>
</head>
<body class="login-page bg-body-secondary">
  <div class="login-box" style="max-width:420px">
    <div class="card card-outline card-primary shadow-lg rounded-4">
      <div class="card-header text-center border-0 pt-4">
        <div class="brand-link d-flex flex-column align-items-center">
          <img src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/img/AdminLTELogo.png"
               alt="Nexus ERP" class="brand-image" style="width:64px;height:64px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.2%">
          <h1 class="h3 fw-bold mt-3 mb-0">Nexus <span class="text-primary">ERP</span></h1>
          <p class="text-muted small mb-0">Enterprise Resource Planning System</p>
        </div>
      </div>
      <div class="card-body login-card-body p-4">
        <!-- Alert error dari query string (: error\) -->
        <div id="alertBox"></div>
        <form id="loginForm" method="POST" action="/login" novalidate>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Username" required minlength="3" autofocus autocomplete="username">
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Password" required minlength="6" autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
          <div class="row">
            <div class="col-8">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="remember">
                <label class="form-check-label" for="remember">Ingat saya</label>
              </div>
            </div>
            <div class="col-4 text-end">
              <button type="submit" class="btn btn-primary btn-block w-100" id="btnLogin">
                <i class="fas fa-sign-in-alt me-1"></i> Masuk
              </button>
            </div>
          </div>
        </form>
        <p class="mt-3 mb-1 text-muted small text-center">
          Default: <code>admin / password123</code> — ganti segera setelah login.
        </p>
      </div>
      <div class="card-footer border-0 text-center pb-4">
        <p class="small text-muted mb-0"><strong>Nexus ERP</strong> v1.0 — AdminLTE 4 &copy; 2026</p>
      </div>
    </div>
  </div>

  <!-- AdminLTE 4 JS + dependensi -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = `
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          <i class="fas fa-circle-exclamation me-2"></i> ${params.get('error')}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
    }

    // Validasi HTML5 front-end
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', (e) => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (!u || p.length < 6) {
        e.preventDefault();
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `
          <div class="alert alert-warning alert-dismissible fade show" role="alert">
            <i class="fas fa-triangle-exclamation me-2"></i> Username wajib diisi dan password minimal 6 karakter.

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>`;
      }
    });

    // Toggle tampil password
    const toggle = document.getElementById('togglePassword');
    const pwd = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    toggle.addEventListener('click', () => {
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      eye.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
  </script>
</body>
</html>
